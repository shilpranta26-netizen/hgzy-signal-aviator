<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WinGo 30s AI VIP Predictor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0e14; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 12px; }
    .card { background: #161b26; border: 1px solid #283046; border-radius: 16px; width: 100%; max-width: 440px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); text-align: center; }
    h2 { color: #f43f5e; margin-bottom: 4px; font-size: 22px; text-transform: uppercase; font-weight: 800; }
    p.sub { font-size: 13px; color: #94a3b8; margin-bottom: 16px; }

    /* Login */
    .input-box { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; margin-bottom: 12px; text-align: center; outline: none; }
    .input-box:focus { border-color: #f43f5e; }
    .btn { width: 100%; padding: 13px; background: #e11d48; color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; }
    .btn:active { transform: scale(0.98); }
    .err-msg { color: #fb7185; font-size: 12px; margin-top: 8px; display: none; }

    /* Dashboard */
    #dashboard { display: none; }
    .period-card { background: #0f172a; border: 1px solid #1e293b; padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; text-align: left; }
    .period-title { font-size: 11px; color: #94a3b8; text-transform: uppercase; }
    .period-num { font-size: 16px; font-weight: 800; color: #38bdf8; letter-spacing: 1px; }

    .timer-card { background: #0b0e14; border: 1px solid #1e293b; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
    .timer-val { font-size: 36px; font-weight: 900; color: #f59e0b; }
